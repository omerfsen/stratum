---
# Stratum on KVM/libvirt. kvm_hosts are the hypervisors; the Stratum nodes are
# VMs that omerfsen.stratum.kvm creates on them and adds to the two Stratum
# groups at run time.
#
# One hypervisor, the controller itself (default below). For several or remote
# hypervisors list them instead; the VMs are spread across them in order, so
# the control planes land on different machines:
#
#   kvm_hosts:
#     hosts:
#       kvm1.example.com: {ansible_user: admin}
#       kvm2.example.com: {ansible_user: admin}
#       kvm3.example.com: {ansible_user: admin}
all:
  children:
    kvm_hosts:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
    stratum_control_plane:
    stratum_workers:
