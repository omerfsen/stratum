---
namespace: omerfsen
name: stratum
version: 0.1.0 # x-release-please-version
readme: README.md
authors:
  - Omer Sen
description: >-
  Install and run CIQ Stratum Kubernetes clusters on RHEL-family hosts:
  prerequisites, verified binary, highly available control planes behind a VIP,
  workers, and VM provisioning on KVM/libvirt.
license:
  - Apache-2.0

tags:
  - stratum
  - kubernetes
  - k8s
  - ciq
  - rocky
  - rhel
  - infrastructure
  - libvirt
dependencies:
  ansible.posix: ">=1.5.0"
repository: https://github.com/omerfsen/stratum
documentation: https://github.com/omerfsen/stratum/blob/main/README.md
issues: https://github.com/omerfsen/stratum/issues
build_ignore:
  - "*.qcow2"
  - "*.img"
  - "*.iso"
  - "*.raw"
  - "*.vmdk"
  - .keys
  - "*_ed25519"
  - "*_ed25519.pub"
  - "*.key"
  - "*.kubeconfig"
  - "*.token"
  - "*.local.yml"
  - inventory/*/group_vars/all/local.yml
  - inventory/*/host_vars
  - __pycache__
  - "*.pyc"
  - .venv
  - .collections
  - .git
  - .github
  - .gitignore
  - graphify-out
  - tools
  - .ansible
  - .ansible-lint
  - Makefile
  - requirements.txt
  - ansible.cfg
  - "*.tar.gz"
  - version.txt
  - release-please-config.json
  - .release-please-manifest.json
