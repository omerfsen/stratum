---
# An admin kubeconfig for the controller, pointed at the VIP (or the first
# control plane without one). Its cluster, user and context are all named
# after the cluster (stratum_cluster_name), so several Stratum clusters never
# collide. Written to stratum_kubeconfig_dest (unless empty) and, with stratum_kubeconfig_merge,
# merged into the main kubeconfig: entries of the same name are replaced, all
# others kept, and a backup is taken first. Plain YAML on the controller: no
# kubectl needed there.

- name: Read the admin kubeconfig
  ansible.builtin.slurp:
    src: /var/lib/stratum/kubeconfig/admin.conf
  register: stratum_admin_conf
  no_log: true

- name: Build the exported kubeconfig
  ansible.builtin.set_fact:
    stratum_kubeconfig: >-
      {%- set src = stratum_admin_conf.content | b64decode | from_yaml -%}
      {%- set name = stratum_cluster_name -%}
      {{ {
           'apiVersion': 'v1',
           'kind': 'Config',
           'preferences': {},
           'clusters': [{'name': name, 'cluster': src.clusters[0].cluster
                           | combine({'server': 'https://' ~ stratum_api_host ~ ':6443'})}],
           'users': [{'name': name, 'user': src.users[0].user}],
           'contexts': [{'name': name, 'context': {'cluster': name, 'user': name}}],
           'current-context': name
         } }}
  vars:
    stratum_api_host: "{{ stratum_vip if stratum_vip | length > 0 else stratum_node_ip }}"
  no_log: true

- name: Write the standalone kubeconfig
  when: stratum_kubeconfig_dest | length > 0
  block:
    - name: Does the kubeconfig directory exist on the controller?
      ansible.builtin.stat:
        path: "{{ stratum_kubeconfig_dest | expanduser | dirname }}"
      delegate_to: localhost
      become: false
      register: stratum_kubeconfig_dir

    # Created when missing; an existing directory (e.g. ~/.kube) keeps its mode.
    - name: Create the kubeconfig directory
      ansible.builtin.file:
        path: "{{ stratum_kubeconfig_dest | expanduser | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      when: not stratum_kubeconfig_dir.stat.exists

    - name: Write it to {{ stratum_kubeconfig_dest }}
      ansible.builtin.copy:
        dest: "{{ stratum_kubeconfig_dest | expanduser }}"
        content: "{{ stratum_kubeconfig | to_nice_yaml(indent=2) }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

- name: Merge it into the main kubeconfig
  when: stratum_kubeconfig_merge | bool
  delegate_to: localhost
  become: false
  block:
    - name: Read the main kubeconfig
      ansible.builtin.slurp:
        src: "{{ stratum_kubeconfig_merge_path | expanduser }}"
      register: stratum_main_kubeconfig
      failed_when: false
      no_log: true

    - name: Merge (same names replaced, the rest kept)
      ansible.builtin.set_fact:
        stratum_merged_kubeconfig: >-
          {%- set old = (stratum_main_kubeconfig.content | b64decode | from_yaml)
                        if stratum_main_kubeconfig.content is defined else {} -%}
          {%- set old = old if old is mapping else {} -%}
          {%- set name = stratum_cluster_name -%}
          {%- set merged = old | combine({
                'apiVersion': 'v1',
                'kind': 'Config',
                'clusters': (old.clusters | default([], true) | rejectattr('name', 'eq', name) | list) + stratum_kubeconfig.clusters,
                'users': (old.users | default([], true) | rejectattr('name', 'eq', name) | list) + stratum_kubeconfig.users,
                'contexts': (old.contexts | default([], true) | rejectattr('name', 'eq', name) | list) + stratum_kubeconfig.contexts}) -%}
          {%- if stratum_kubeconfig_set_current | bool or not old['current-context'] | default('') -%}
          {%-   set merged = merged | combine({'current-context': name}) -%}
          {%- endif -%}
          {{ merged }}
      no_log: true

    - name: Write the main kubeconfig (backup first)
      ansible.builtin.copy:
        dest: "{{ stratum_kubeconfig_merge_path | expanduser }}"
        content: "{{ stratum_merged_kubeconfig | to_nice_yaml(indent=2) }}"
        mode: "0600"
        backup: true
      no_log: true
