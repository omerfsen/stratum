---
# Host prerequisites from docs.ciq.com/stratum/installation: supported
# platform, packages, SELinux, firewalld as in CIQ's tested configuration,
# then the binary.

- name: Supported platform
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'RedHat'
      - ansible_facts['distribution_major_version'] | int >= 9
      - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    fail_msg: >-
      Stratum needs a RHEL-family 9+ host on x86_64 or aarch64; this is
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
      {{ ansible_facts['architecture'] }}.
    quiet: true

- name: Read the cgroup filesystem type
  ansible.builtin.command: stat -fc %T /sys/fs/cgroup
  register: stratum_cgroup_fs
  changed_when: false
  check_mode: false

- name: Cgroup v2 only
  ansible.builtin.assert:
    that: stratum_cgroup_fs.stdout == 'cgroup2fs'
    fail_msg: Stratum needs the unified cgroup v2 hierarchy.
    quiet: true

- name: Install the packages Stratum needs
  ansible.builtin.dnf:
    name:
      # SELinux policy for containers, semanage, matchpathcon. Stratum refuses
      # a new node under enforcing SELinux without them.
      - container-selinux
      - policycoreutils-python-utils
      - libselinux-utils
      # tc, iptables-save/ip6tables-save, bpftool: used by `stratum uninstall`
      - iproute-tc
      - iptables-nft
      - bpftool
    state: present

- name: Read the SELinux mode
  ansible.builtin.command: getenforce
  register: stratum_selinux_mode
  changed_when: false
  check_mode: false

- name: SELinux enforcing
  ansible.builtin.assert:
    that: stratum_selinux_mode.stdout == 'Enforcing'
    fail_msg: >-
      SELinux is {{ stratum_selinux_mode.stdout }}. Set it to enforcing, or set
      stratum_require_selinux_enforcing=false.
    quiet: true
  when: stratum_require_selinux_enforcing | bool

- name: Firewalld
  ansible.builtin.include_tasks: firewalld.yml
  when: stratum_firewalld | string | lower != 'false'

- name: The Stratum binary
  ansible.builtin.include_tasks: binary.yml
