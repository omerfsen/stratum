---
argument_specs:
  main:
    short_description: Create one cloud-image VM on a libvirt/KVM host.
    description:
      - Generates an ed25519 keypair on the controller and a cloud-init seed with a static address.
      - Creates the domain with virt-install (UEFI, virtio, host-passthrough CPU) on a libvirt network or a host bridge.
      - Idempotent. Runs on an x86_64 KVM host as root. Needs virt-install, qemu-img and genisoimage.
      - vCPUs, memory and disk apply when the VM is created; cloud-init grows the root filesystem on first boot.
    author: Omer Sen
    options:
      libvirt_vm_name:
        type: str
        required: true
        description: Domain name and guest hostname.
      libvirt_vm_ip:
        type: str
        required: true
        description: Static IPv4 address of the guest.
      libvirt_vm_vcpus:
        type: int
        default: 4
        description: Virtual CPUs.
      libvirt_vm_memory_mb:
        type: int
        default: 8192
        description: Memory in MiB.
      libvirt_vm_disk_gb:
        type: int
        default: 40
        description: Disk size in GiB, set at creation. The qcow2 is thin.
      libvirt_vm_image_url:
        type: str
        default: https://dl.rockylinux.org/pub/rocky/10.2/images/x86_64/Rocky-10-GenericCloud-Base-10.2-20260525.0.x86_64.qcow2
        description: Cloud image the disk is copied from. Downloaded once.
      libvirt_vm_image_checksum:
        type: str
        default: sha256:9fc9e9ff16888bb68ac39b0392e25c9c92684d50c85f1cce6ab549363bbc4b48
        description: Checksum of the image as C(algorithm:hex).
      libvirt_vm_osinfo:
        type: str
        default: rhel10.1
        description: virt-install C(--osinfo) value.
      libvirt_vm_network:
        type: str
        default: default
        description: libvirt network the VM is attached to.
      libvirt_vm_bridge:
        type: str
        default: ""
        description: Host bridge to attach to (e.g. C(br0)) instead of O(libvirt_vm_network), for VMs directly on the LAN.
      libvirt_vm_prefix:
        type: int
        default: 24
        description: Prefix length of the static address.
      libvirt_vm_gateway:
        type: str
        default: 192.168.122.1
        description: Default gateway.
      libvirt_vm_dns:
        type: list
        elements: str
        default: [192.168.122.1]
        description: DNS servers.
      libvirt_vm_user:
        type: str
        default: rocky
        description: Login user created by cloud-init, with passwordless sudo and SSH key login only.
      libvirt_vm_autostart:
        type: bool
        default: true
        description: Start the domain with the host.
      libvirt_vm_disk_path:
        type: path
        default: /var/lib/libvirt/images
        description: Directory for the disks, the seeds and the base image.
      libvirt_vm_mac:
        type: str
        default: ""
        description:
          - MAC address of the NIC, lower case. cloud-init matches the static address to it.
          - Empty derives a stable C(52:54:00:xx:xx:xx) from the VM name, so a rebuilt VM keeps its MAC.
      libvirt_vm_ssh_key_dir:
        type: path
        default: ~/.ssh/stratum
        description: Where the per-VM keypairs are kept, on the controller.
      libvirt_vm_ssh_key_path:
        type: path
        description: Private key of this VM. Default C(<key dir>/<name>_ed25519).
